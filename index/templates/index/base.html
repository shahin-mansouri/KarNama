{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}کارنما{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}نمونه‌کار و رزومه آنلاین شاهین منصوری، توسعه‌دهنده فرانت‌اند و بک‌اند.{% endblock %}" />
  <link rel="canonical" href="https://yourdomain.com" />
  <link rel="alternate" hreflang="fa" href="https://yourdomain.com" />
  <meta property="og:title" content="شاهین منصوری | نمونه‌کار حرفه‌ای" />
  <meta property="og:description" content="نمونه‌کار و رزومه آنلاین شاهین منصوری، توسعه‌دهنده فرانت‌اند و بک‌اند." />
  <meta property="og:image" content="https://yourdomain.com/assets/images/og-image.jpg" />
  <meta property="og:url" content="https://yourdomain.com" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍💻</text></svg>" />
  <link rel="stylesheet" href="{% static 'index/css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>

  <header class="navbar" role="banner">
    <div class="container">
      <!-- <a href="#" class="nav-logo">K<span>N</span></a> -->
      <a href="{% url 'home' %}"><img style="width: 85px;" src="{% static 'index/image/logo.png' %}" alt="" srcset=""></a>

      <nav aria-label="Main navigation">
        <ul class="nav-links" id="navLinks" role="menubar">
          <li role="none"><a href="#hero" role="menuitem">خانه</a></li>
          <li role="none"><a href="#about" role="menuitem">درباره</a></li>
          <li role="none"><a href="#skills" role="menuitem">مهارت‌ها</a></li>
          <li role="none"><a href="#experience" role="menuitem">تجربه</a></li>
          <li role="none"><a href="#projects" role="menuitem">پروژه‌ها</a></li>
          <li role="none"><a href="#certificates" role="menuitem">گواهینامه‌ها</a></li>
          <li role="none"><a href="#contact" role="menuitem">تماس</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer" style="background:var(--surface2); padding:30px 0; text-align:center; border-top:1px solid var(--border);">
    <div class="container">
      <p style="color:var(--text2);">&copy; 2026 <span>شاهین منصوری</span>. <span>تمامی حقوق محفوظ است</span>.</p>
    </div>
  </footer>

  <button class="back-top" id="backTop" aria-label="بازگشت به بالا">↑</button>

  <script src="{% static 'index/js/scripts.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
